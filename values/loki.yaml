# RKE2 names its DNS Service rke2-coredns-rke2-coredns, not kube-dns; the
# gateway's nginx resolver crash-loops with "host not found" otherwise.
global:
  dnsService: rke2-coredns-rke2-coredns
loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
    - from: '2024-01-01'
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: loki_index_
        period: 24h
  auth_enabled: false
serviceAccount:
  create: true
  name: loki
# Filesystem storage only supports one Monolithic replica; the scalable
# targets need object storage, so they're scaled to zero.
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi
gateway:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
chunksCache:
  enabled: false
resultsCache:
  enabled: false
test:
  enabled: false
lokiCanary:
  enabled: false
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
