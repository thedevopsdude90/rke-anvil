# Grafana's admin login, filled from Anvil's vault at sync time - only the
# references are in Git. values/grafana.yaml points admin.existingSecret here.
# Store the values first (from the anvil repo's examples/ folder):
#   ./add-secret.sh grafana/admin username=admin password=@random
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: grafana
type: Opaque
stringData:
  admin-user: anvil-secret://grafana/admin#username
  admin-password: anvil-secret://grafana/admin#password
